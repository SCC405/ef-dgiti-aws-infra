name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ASG_NAME: ef-dgiti-asg
  ALB_NAME: ef-dgiti-alb
  TG_NAME: ef-dgiti-tg

jobs:
  # -------------------------------------------------------------------------
  # 1. Calidad del código y pruebas unitarias + integración
  # -------------------------------------------------------------------------
  test:
    name: 1 - Lint y pruebas (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Pruebas unitarias e integración
        run: pytest -v --junitxml=junit.xml --cov=app --cov-report=term --cov-report=xml

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: |
            junit.xml
            coverage.xml

  # -------------------------------------------------------------------------
  # 2. Imagen Docker + prueba de humo del contenedor
  # -------------------------------------------------------------------------
  docker:
    name: 2 - Build Docker y smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t ef-dgiti-api:${{ github.sha }} .

      - name: Levantar contenedor y probar /health y /status
        run: |
          docker run -d --name api -p 8000:8000 -e DATABASE_URL=sqlite:// ef-dgiti-api:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs http://localhost:8000/health && break; sleep 1; done
          curl -fs http://localhost:8000/health | grep '"status":"ok"'
          curl -fs http://localhost:8000/status | grep '"primary":"ok"'
          curl -fs -X POST http://localhost:8000/api/items -H 'Content-Type: application/json' -d '{"name":"ci"}'
          docker logs api

  # -------------------------------------------------------------------------
  # 3. Validación de la infraestructura como código
  # -------------------------------------------------------------------------
  terraform:
    name: 3 - Terraform fmt / validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

  # -------------------------------------------------------------------------
  # 4. Despliegue: rolling update del Auto Scaling Group en AWS Academy
  #    Las credenciales llegan como GitHub Secrets, nunca están en el código.
  # -------------------------------------------------------------------------
  deploy:
    name: 4 - Despliegue en AWS (rolling update)
    runs-on: ubuntu-latest
    needs: [test, docker, terraform]
    if: github.event_name != 'pull_request'
    environment: aws-academy
    steps:
      - name: Verificar que existan los secretos
        id: secrets
        env:
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::No hay secretos AWS configurados: se omite el despliegue."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar credenciales AWS (desde secrets)
        if: steps.secrets.outputs.ok == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Identidad de la cuenta
        if: steps.secrets.outputs.ok == 'true'
        run: aws sts get-caller-identity --query Account --output text | sed 's/^\(....\).*/\1********/'

      # AWS Academy bloquea StartInstanceRefresh, así que el rolling update se hace
      # a mano: se reemplaza una instancia a la vez y se espera a que la nueva quede
      # sana en el balanceador antes de seguir. El servicio nunca se queda sin instancias.
      - name: Rolling update (las nuevas EC2 clonan este commit)
        if: steps.secrets.outputs.ok == 'true'
        timeout-minutes: 30
        run: |
          TG=$(aws elbv2 describe-target-groups --names "$TG_NAME" --query 'TargetGroups[0].TargetGroupArn' --output text)
          read DESIRED IDS <<< $(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].[DesiredCapacity, join(` `, Instances[].InstanceId)]' --output text)
          echo "Capacidad deseada: $DESIRED | instancias a reemplazar: $IDS"

          for OLD in $IDS; do
            echo "::group::Reemplazando $OLD"
            aws autoscaling terminate-instance-in-auto-scaling-group \
              --instance-id "$OLD" --no-should-decrement-desired-capacity --query 'Activity.Description' --output text
            for i in $(seq 1 45); do
              HEALTHY=$(aws elbv2 describe-target-health --target-group-arn "$TG" \
                --query "length(TargetHealthDescriptions[?TargetHealth.State=='healthy' && Target.Id!='$OLD'])" --output text)
              echo "$(date +%T)  sanas sin $OLD: $HEALTHY/$DESIRED"
              [ "$HEALTHY" -ge "$DESIRED" ] && break
              [ "$i" -eq 45 ] && { echo "::error::La instancia nueva no quedó sana"; exit 1; }
              sleep 20
            done
            echo "::endgroup::"
          done

      - name: Prueba de humo contra el ALB (versión desplegada = este commit)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          DNS=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" --query 'LoadBalancers[0].DNSName' --output text)
          EXPECTED=${GITHUB_SHA::7}
          curl -fs "http://$DNS/health"; echo
          for i in 1 2 3 4 5 6; do
            curl -fs "http://$DNS/status" | python3 -c '
          import sys, json
          d = json.load(sys.stdin)
          print(d["instance_id"], d["availability_zone"], "version", d["version"], "db", d["database"]["primary"], d["database"]["replica"])
          assert d["version"] == sys.argv[1], "version distinta a la del commit"
          assert d["database"]["primary"] == "ok" and d["database"]["replica"] == "ok", "BD no disponible"
          ' "$EXPECTED"
          done
          echo "### Desplegado $EXPECTED en http://$DNS" >> "$GITHUB_STEP_SUMMARY"